services:
  # Frontend - Vue 3 (Development Mode)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: railway_telamonet_frontend
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCH_INTERVAL=500
      - VITE_SIGNALING_URL=http://localhost:3001
    depends_on:
      - backend
      - signaling
    networks:
      - app-network

  # Signaling Server for Video Chat
  signaling:
    build:
      context: ./signaling
    container_name: railway_telamonet_signaling
    ports:
      - "3001:3000"
    networks:
      - app-network

  # Backend - Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: railway_telamonet_backend
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - app-network

  # Servidor Web para Laravel (Nginx)
  nginx:
    image: nginx:stable-alpine
    container_name: railway_telamonet_nginx
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  # Base de Datos - MySQL
  db:
    image: mysql:8.0
    container_name: railway_telamonet_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: telamonet
      MYSQL_USER: telamo_user
      MYSQL_PASSWORD: telamo_pass
    ports:
      - "3308:3306"
    volumes:
      - railway_mysql_data:/var/lib/mysql
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: railway_telamonet_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  railway_mysql_data:
  frontend_node_modules:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:










