version: "3.9"

# =============================================================================
# TelamoNet - Docker Compose de Alta Disponibilidad
# "Fortaleza Digital: Blindaje y Resiliencia"
# =============================================================================
# Levanta 2 réplicas del backend Laravel y un balanceador Nginx
# Uso: docker compose -f docker-compose.ha.yml up --build --scale backend=2
# =============================================================================

x-backend-defaults: &backend-defaults
  build:
    context: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - app-network
  volumes:
    - backend_vendor:/var/www/vendor
    - backend_storage:/var/www/storage
    - backend_bootstrap_cache:/var/www/bootstrap/cache
  environment:
    - APP_ENV=${APP_ENV:-production}
    - APP_DEBUG=${APP_DEBUG:-false}
    - APP_KEY=${APP_KEY}
    - APP_URL=${APP_URL:-https://localhost}
    - DB_CONNECTION=mysql
    - DB_HOST=db
    - DB_PORT=3306
    - DB_DATABASE=${DB_DATABASE:-telamonet}
    - DB_USERNAME=${DB_USERNAME:-telamo_user}
    - DB_PASSWORD=${DB_PASSWORD:-telamo_pass}
    - CACHE_DRIVER=redis
    - SESSION_DRIVER=redis
    - QUEUE_CONNECTION=redis
    - REDIS_HOST=redis
    - REDIS_PORT=6379
  healthcheck:
    # php-fpm -t valida la configuración y confirma que el proceso está vivo
    # (php artisan health requiere el paquete spatie/laravel-health)
    test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:

  # ===========================================================================
  # BACKEND RÉPLICA 1
  # ===========================================================================
  backend_1:
    <<: *backend-defaults
    container_name: telamonet_backend_1
    # No expone puertos directamente al host (solo accesible vía Nginx)

  # ===========================================================================
  # BACKEND RÉPLICA 2
  # ===========================================================================
  backend_2:
    <<: *backend-defaults
    container_name: telamonet_backend_2

  # ===========================================================================
  # BALANCEADOR DE CARGA - NGINX
  # ===========================================================================
  nginx:
    image: mirror.gcr.io/library/nginx:stable-alpine
    container_name: telamonet_loadbalancer
    restart: unless-stopped
    ports:
      # Solo exponer HTTP y HTTPS al host (SSL termina aquí)
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.ha.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro        # Frontend Vue buildeado
      - /etc/letsencrypt:/etc/letsencrypt:ro    # Certificados Let's Encrypt
      - /var/www/certbot:/var/www/certbot:ro    # Validación Certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend_1
      - backend_2
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # BASE DE DATOS - MYSQL (solo accesible internamente)
  # ===========================================================================
  db:
    image: mirror.gcr.io/library/mysql:${MYSQL_VERSION:-8.0}
    container_name: telamonet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE:      ${DB_DATABASE:-telamonet}
      MYSQL_USER:          ${DB_USERNAME:-telamo_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?DB_PASSWORD must be set}
    # Puerto solo en localhost (no exponer al exterior → ver WARN en harden.sh)
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/telamonet.cnf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # REDIS - Sesiones, caché y colas compartidas entre réplicas
  # ===========================================================================
  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    container_name: telamonet_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redis_pass_secure}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - app-network
    # Redis NUNCA expone puerto al exterior
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_secure}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # SERVIDOR DE SEÑALIZACIÓN (Videollamadas)
  # ===========================================================================
  signaling:
    build:
      context: ./signaling
    container_name: telamonet_signaling
    restart: unless-stopped
    networks:
      - app-network
    # No expuesto al exterior directamente; accesible via Nginx /ws/

  # ===========================================================================
  # phpMyAdmin - solo en desarrollo local (desactivar en producción)
  # ===========================================================================
  phpmyadmin:
    image: mirror.gcr.io/phpmyadmin/phpmyadmin
    container_name: telamonet_phpmyadmin
    profiles:
      - dev   # Solo se levanta con: docker compose --profile dev up
    environment:
      PMA_HOST:      db
      PMA_PORT:      3306
      PMA_ARBITRARY: 1
    # Solo accesible desde localhost del servidor (no internet)
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
    networks:
      - app-network

# =============================================================================
# REDES
# =============================================================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# VOLÚMENES
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
  nginx_logs:
