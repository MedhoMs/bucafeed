server {
    listen 80;
    server_name localhost;

    # Serve the Vue.js frontend static files
    location / {
        root /var/www/public;
        try_files $uri $uri/ /frontend/index.html?$query_string;
    }

    # Proxy API requests to the Laravel backend
    location /api {
        rewrite ^/api/(.*)$ /$1 break; # Remove /api prefix before sending to Laravel
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php; # Laravel's public index.php
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Handle remaining PHP files for Laravel if any are directly accessed (e.g., for non-/api routes if Nginx passes them through)
    location ~ \.php$ {
        # This block might not be strictly necessary if /api covers all backend needs
        # but is kept for a robust Laravel setup.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}