# =============================================================================
# TelamoNet - Nginx Load Balancer + SSL (usado por docker-compose.ha.yml)
# =============================================================================
# Este archivo es la configuración de Nginx dentro del contenedor del
# balanceador de carga. El SSL termina en Nginx y se distribuye el tráfico
# entre backend_1 y backend_2 usando el algoritmo least_conn.
# =============================================================================

# ---- Pool de backends Laravel (2 réplicas) ----
upstream telamonet_php {
    least_conn;
    server backend_1:9000  weight=1 max_fails=3 fail_timeout=30s;
    server backend_2:9000  weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---- Rate limiting zones ----
limit_req_zone  $binary_remote_addr zone=global_api:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# =============================================================================
# HTTP → Redirigir a HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Renovación de certificados Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS Principal
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ---- Certificados Let's Encrypt ----
    # En producción reemplazar con el dominio real
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # ---- TLS Moderno (solo TLS 1.2 y 1.3) ----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Ocultar versión de servidor ----
    server_tokens off;

    # ---- Cabeceras de Seguridad HTTP (OWASP Hardening) ----
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "DENY"                                         always;
    add_header X-Content-Type-Options      "nosniff"                                      always;
    add_header X-XSS-Protection            "1; mode=block"                                always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=(self)" always;

    # ---- Límite de conexiones simultáneas por IP (anti-DDoS) ----
    limit_conn conn_per_ip 20;

    # ---- Tamaño máximo de petición ----
    client_max_body_size 50M;

    # ---- Logs ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # =========================================================================
    # RUTAS
    # =========================================================================

    # -- Frontend Vue (SPA estático) --
    location / {
        root  /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache agresivo para assets estáticos con hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }
    }

    # -- API Laravel (balanceada entre réplicas) --
    location /api/ {
        limit_req zone=global_api burst=60 nodelay;

        fastcgi_pass   telamonet_php;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param  SERVER_NAME     $host;
        fastcgi_param  HTTPS           on;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout    30s;
        fastcgi_read_timeout    30s;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
    }

    # -- Rutas de autenticación (rate limit estricto: 5/min por IP) --
    location ~ ^/api/(auth|login|register|password) {
        limit_req zone=auth_zone burst=3 nodelay;

        fastcgi_pass  telamonet_php;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param HTTPS on;
    }

    # -- WebSocket Signaling (videollamadas) --
    location /ws/ {
        proxy_pass         http://signaling:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -- Health check del balanceador --
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","backends":["backend_1","backend_2"]}';
    }

    # -- Bloquear acceso a rutas sensibles --
    location ~ /\.(env|git|gitignore|htaccess|htpasswd|sql|sh|bak) {
        deny all;
        return 404;
    }

    location ~ ^/(storage|bootstrap|vendor|database|config)/ {
        deny all;
        return 403;
    }
}
