# Nginx configuration for Railway
# This file is processed by envsubst and placed in /etc/nginx/conf.d/default.conf

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Resolver para permitir variables en proxy_pass (Google DNS)
    resolver 8.8.8.8 valid=30s;

    # Logs a stdout para verlos en Railway
    access_log /dev/stdout;
    error_log /dev/stdout info;

    location /socket.io/ {
        # Si SIGNALING_URL no está definida, devolvemos 404 en lugar de crashear
        set $signaling_url "${SIGNALING_URL}";
        if ($signaling_url = "") {
            return 404;
        }

        proxy_pass $signaling_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
